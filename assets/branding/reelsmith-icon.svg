<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Reelsmith app icon. public/reelsmith-icon.png, assets/branding/reelsmith-icon.icns and
       assets/favicon.svg are generated from this file (commands in reelsmith-docs/BRANDING.md). -->
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#2a1a4a"/><stop offset="1" stop-color="#0c0817"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55"><stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
  <linearGradient id="ember" x1="0.1" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset="0.45" stop-color="#ff6a3d"/><stop offset="1" stop-color="#e8236b"/></linearGradient>
  <linearGradient id="ember2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8327a"/><stop offset="1" stop-color="#5a1d6e"/></linearGradient>
  <linearGradient id="ember3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b2a8a"/><stop offset="1" stop-color="#2f1650"/></linearGradient>
  <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
<rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
<!-- three reels, fanned; the front one plays -->
<g transform="translate(512 548)">
  <g transform="rotate(-15) translate(-140 6)"><rect x="-160" y="-282" width="320" height="564" rx="68" fill="url(#ember3)"/></g>
  <g transform="rotate(15) translate(140 6)"><rect x="-160" y="-282" width="320" height="564" rx="68" fill="url(#ember2)"/></g>
  <g filter="url(#shadow)"><rect x="-182" y="-316" width="364" height="632" rx="78" fill="url(#ember)"/></g>
  <rect x="-182" y="-316" width="364" height="632" rx="78" fill="url(#hi)"/>
  <rect x="-180" y="-314" width="360" height="628" rx="76" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M-56 -94 L102 0 L-56 94 Z" fill="#ffffff" stroke="#ffffff" stroke-width="46" stroke-linejoin="round"/>
</g>
<!-- forge spark -->
<path d="M808 92 L832 168 L908 192 L832 216 L808 292 L784 216 L708 192 L784 168 Z" fill="url(#spark)"/>
<circle cx="908" cy="318" r="14" fill="#ffd27a" opacity="0.9"/>
</svg>
